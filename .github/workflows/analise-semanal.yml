name: Análise semanal (rascunho para aprovação)
# Roda toda sexta-feira às 20h no horário de Brasília (23h UTC) - depois
# do fechamento da semana em Nova York e nas praças físicas brasileiras,
# cobrindo a semana Seg-Sex inteira. Também pode ser disparado manualmente
# pela aba "Actions" do GitHub.
#
# IMPORTANTE: este workflow NUNCA publica direto no site. Ele gera o
# conteúdo (gerar_analise_semanal.py), commita numa branch nova e abre um
# Pull Request - alguém (você) revisa e decide mergear. Ver
# gerar_analise_semanal.py para as regras editoriais (atribuição
# obrigatória às fontes, nunca inventar fato, etc.).
on:
  schedule:
    - cron: "0 23 * * 5"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  gerar-rascunho:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests pandas lxml beautifulsoup4 anthropic

      - name: Criar branch da semana
        run: |
          git config user.name "AgroFer Trader Bot"
          git config user.email "bot@agrofertrader.local"
          echo "NOME_BRANCH=analise-semanal-$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          git checkout -b "analise-semanal-$(date +'%Y-%m-%d')"

      - name: Gerar rascunho da análise semanal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gerar_analise_semanal.py

      - name: Commitar e abrir PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add commodities/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança gerada nesta rodada (sem cobertura das fontes ou falha na coleta) - pulando PR."
            echo "abriu_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Análise semanal (rascunho) - $(date +'%d/%m/%Y')"
          git push origin "$NOME_BRANCH"
          URL_PR=$(gh pr create \
            --title "Análise semanal — rascunho ($(date +'%d/%m/%Y'))" \
            --body "Rascunho gerado automaticamente por gerar_analise_semanal.py a partir de matérias reais da semana (Notícias Agrícolas), com atribuição às fontes em cada parágrafo. Revise o conteúdo página por página antes de mergear - nada foi publicado ainda." \
            --base main --head "$NOME_BRANCH")
          echo "url_pr=$URL_PR" >> "$GITHUB_OUTPUT"
          echo "abriu_pr=true" >> "$GITHUB_OUTPUT"

      - name: Enviar e-mail de notificação
        if: steps.pr.outputs.abriu_pr == 'true'
        env:
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          python notificar_analise_semanal.py "${{ steps.pr.outputs.url_pr }}" $(git diff --name-only main -- commodities/ | cut -d/ -f2 | sort -u)
